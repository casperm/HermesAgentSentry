# Logrotate configuration for Suricata logs
# ==========================================
# 365-day retention for JSON/Log files (audit)
# 30-day retention for PCAP files (troubleshooting)
#
# Deployed via bind mount into the Suricata container at:
#   /etc/logrotate.d/suricata

/var/log/suricata/*.json /var/log/suricata/*.log {
    daily
    rotate 365
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    postrotate
        if [ -f /var/run/suricata.pid ]; then
            kill -USR2 "$(cat /var/run/suricata.pid)" 2>/dev/null || true
        fi
    endscript
}

/var/log/suricata/*.pcap* {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}
